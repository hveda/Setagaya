name: Security

on:
  # pull_request covers feature->develop and develop->main; push only on
  # main (post-merge) so a merge to develop does not also run via the open
  # develop->main PR.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        # Advisory: -no-fail keeps findings non-blocking (govulncheck remains the
        # hard vulnerability gate, respecting existing #nosec annotations). SARIF
        # is emitted so results surface on the Security tab / code-scanning "gosec"
        # tool.
        run: gosec -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        # Advisory table output to the job log (deps, secrets, misconfig).
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "0"
