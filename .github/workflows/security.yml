name: Security

on:
  # pull_request covers feature->develop and develop->main; push only on
  # main (post-merge) so a merge to develop does not also run via the open
  # develop->main PR.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
      - name: Run gosec
        # Advisory: -no-fail keeps findings non-blocking (govulncheck remains the
        # hard vulnerability gate, respecting existing #nosec annotations). SARIF
        # is emitted so results surface on the Security tab / code-scanning "gosec"
        # tool.
        run: gosec -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec SARIF
        # Transient GitHub API outages (5xx "No server is currently
        # available" on the SARIF upload endpoint) must not fail CI: the
        # scan itself is strict above, and the SARIF is also uploaded as a
        # build artifact, so only this code-scanning sync degrades.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: gosec.sarif
          category: gosec

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Trivy filesystem scan (SARIF)
        # Advisory (exit-code 0); deps, secrets, misconfig. Results upload to
        # code scanning so the Trivy tool reports on the Security tab.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - name: Upload Trivy SARIF
        # Transient GitHub API 5xx outages (observed: run 32049432183, the
        # scan passed but the upload failed with "No server is currently
        # available") must not fail CI. The scan steps above stay strict.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy.sarif
          category: trivy

  grype:
    name: grype
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Grype filesystem scan (SARIF)
        id: grype
        # Advisory (fail-build false); dependency vulnerability scan.
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          path: "."
          fail-build: false
      - name: Upload Grype SARIF
        # Same transient-5xx hardening as the other SARIF uploads: the
        # scan is strict, the code-scanning sync degrades gracefully.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Hadolint grafana/Dockerfile (SARIF)
        # Advisory (no-fail); Dockerfile lint.
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: grafana/Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true
      - name: Upload Hadolint SARIF
        # Same transient-5xx hardening as the other SARIF uploads: the
        # scan is strict, the code-scanning sync degrades gracefully.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  scorecard:
    name: scorecard
    runs-on: ubuntu-latest
    # Scorecard analyses repo-level posture (branch protection, tokens, etc.),
    # which is only meaningful on the default branch — skip pull_request runs.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: OSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: scorecard.sarif
          category: scorecard
