name: CI

on:
  # Run once per change: pull_request covers feature->develop and
  # develop->main; push only on main (post-merge). Scoping push to main
  # avoids a duplicate run when a merge to develop also syncs the open
  # develop->main PR.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - name: Lint
        run: "$(go env GOPATH)/bin/golangci-lint run ./..."
      - name: Unit tests (race)
        run: go test -race -count=1 ./...

  coverage:
    name: Coverage gate (unit + integration + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum
      - name: Run coverage gate
        run: ./scripts/coverage.sh
        env:
          COVERAGE_THRESHOLD: "90"
          # GitHub-hosted runners provide Docker for testcontainers.
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./cover.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: cover.out
