name: CI

on:
  # pull_request covers feature->develop and develop->main; since phase 14
  # every phase merge goes through a feat->develop PR, so pull_request
  # already gives feat branches full CI -- a feat/** push trigger is pure
  # duplication (and raced pull_request into double runs; a concurrency
  # group cannot fix a 3-second registration race). push stays for main
  # only, covering the post-merge case.
  push:
    branches: [main]
  pull_request:

# One in-flight run per branch: guards the edge where a main push and a
# develop->main PR-sync event race (head_ref is the PR's source branch;
# ref_name is the pushed bare branch name -- plain ref would never match).
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - name: Lint
        run: "$(go env GOPATH)/bin/golangci-lint run ./..."
      - name: Unit tests (race)
        run: go test -race -count=1 ./...

  coverage:
    name: Coverage gate (unit + integration + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Run coverage gate
        run: ./scripts/coverage.sh
        env:
          COVERAGE_THRESHOLD: "90"
          # GitHub-hosted runners provide Docker for testcontainers.
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./cover.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: cover.out
