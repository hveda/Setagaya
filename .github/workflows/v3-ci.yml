name: v3 CI

on:
  push:
    branches: [main, develop]
    paths:
      - "v3/**"
      - ".github/workflows/v3-ci.yml"
  pull_request:
    paths:
      - "v3/**"
      - ".github/workflows/v3-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: v3

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: v3/go.sum
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
      - name: Lint
        run: "$(go env GOPATH)/bin/golangci-lint run ./..."
      - name: Unit tests (race)
        run: go test -race -count=1 ./...

  coverage:
    name: Coverage gate (unit + integration + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: v3/go.sum
      - name: Run coverage gate
        run: ./scripts/coverage.sh
        env:
          COVERAGE_THRESHOLD: "90"
          # GitHub-hosted runners provide Docker for testcontainers.
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-coverage
          path: v3/cover.out
