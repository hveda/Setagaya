# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Go module (repository root)
  - package-ecosystem: "gomod"
    directory: "/"
    # PRs target develop, not main: merging straight to main would bypass
    # the develop lane (feat/* -> develop -> main) and collide with the
    # standing develop->main promotion PR.
    target-branch: "develop"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    reviewers:
      - "heridotlife"
    assignees:
      - "heridotlife"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker base images (Grafana dashboards image)
  - package-ecosystem: "docker"
    directory: "/grafana"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"

  # npm dev tooling (prettier / yamllint helpers)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    reviewers:
      - "heridotlife"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
