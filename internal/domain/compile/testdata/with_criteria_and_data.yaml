execution:
    - executor: jmeter
      concurrency: 50
      ramp-up: 30s
      hold-for: 10m
      scenario: checkout-11
scenarios:
    checkout-11:
        default-address: http://checkout.svc
        requests:
            - url: /cart
              label: checkout-cart
              method: GET
            - url: /checkout
              label: checkout-checkout
              method: POST
        data-sources:
            - path: /honryu/execution/7/users.csv
reporting:
    - module: passfail
      criteria:
        - failures>1% for 30s, stop as failed
        - p95>500ms, continue as failed
