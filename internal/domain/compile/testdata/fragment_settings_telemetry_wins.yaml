execution:
    - executor: jmeter
      concurrency: 50
      ramp-up: 30s
      hold-for: 10m
      scenario: checkout-11
scenarios:
    checkout-11:
        default-address: http://checkout.svc
        headers:
            X-Auth: fragment-token
            baggage: run-id=7
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        requests:
            - url: /cart
              label: checkout-cart
              method: GET
            - url: /checkout
              label: checkout-checkout
              method: POST
        timeout: 90s
        keepalive: true
