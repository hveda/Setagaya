version: "2"

run:
  timeout: 5m
  build-tags:
    - integration
    - e2e

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    rules:
      # Test files may ignore errors on cleanup helpers and use dot-imports.
      - path: _test\.go
        linters:
          - errcheck
          - unparam
      # Test doubles and conformance harnesses implement documented port
      # interfaces; per-method doc comments would be redundant noise.
      - path: internal/ports/(fake|repositorytest|objectstoretest)/
        linters:
          - revive
      # ExecutionPlan/ExecutionCollection are established domain terms; renaming
      # to execution.Plan/Collection would collide with the plan/collection
      # aggregates.
      - path: internal/domain/execution/
        text: stutters
        linters:
          - revive
      # EngineName/EngineLabels name the engine's scheduler object; renaming to
      # Name/Labels would collide with the generic engine.Name(kind, ...) helper.
      - path: internal/domain/engine/
        text: stutters
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/heridotlife/honryu
