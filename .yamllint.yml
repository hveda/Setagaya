# yamllint configuration file
# https://yamllint.readthedocs.io/en/stable/configuration.html
# Designed to work with prettier auto-formatting

extends: default

rules:
  # Allow longer lines for readability (prettier handles line wrapping)
  line-length:
    max: 120
    level: warning

  # Prettier handles indentation consistently
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  # Be more flexible with comments (prettier formats them)
  comments:
    min-spaces-from-content: 1

  # Allow empty values (common in Kubernetes)
  empty-values:
    forbid-in-block-mappings: false
    forbid-in-flow-mappings: false

  # Allow truthy values (GitHub Actions uses 'on:')
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    check-keys: false

  # Allow brackets for lists (prettier may format this way)
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # Same allowance for flow mappings as the brackets rule above gives flow
  # sequences -- the two were meant to match, but only brackets was set, so
  # every `{ type: string }` in api/openapi.yaml counted as two errors
  # (1088 in that file alone) and `npm run check` had never once passed.
  # That style is deliberate and is what prettier produces here, so the
  # config accommodates it rather than fighting it.
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # Document start is optional (prettier doesn't add ---)
  document-start:
    present: false

  # Octal values (often used in file permissions)
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: false

  # Be more lenient with key ordering for GitHub Actions
  key-ordering: disable

ignore: |
  # Ignore generated files
  **/templates/*.yaml
  **/charts/*/templates/*.yaml
  node_modules/
  # Ignore vendored files
  vendor/
  # Ignore GitHub Actions workflows
  .github/workflows/*.yml
  .github/workflows/*.yaml
  # Ignore Grafana dashboard files
  grafana/dashboards/**
  # Golden fixtures: the exact bytes of Go's yaml.Marshal output, compared
  # byte-for-byte by TestTaurus_Golden (`string(got) != string(want)`) and
  # regenerated with `-update`. Their formatting is the marshaller's to
  # decide, not a style choice -- reformatting them to satisfy a linter
  # would fail the test suite and be overwritten on the next update run.
  internal/domain/compile/testdata/**
  # Local object-store output from a dev run: gitignored, machine-written,
  # and the same marshaller output as the golden fixtures above.
  storage-data/**
  # Pinned upstream cluster manifests, vendored verbatim so the cluster is
  # reproducible -- restyling them would defeat the point of pinning. They
  # are also multi-document, where `---` is required YAML syntax rather than
  # the optional leading marker the document-start rule above disallows.
  deploy/cluster/**
