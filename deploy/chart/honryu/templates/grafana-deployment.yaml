{{- if .Values.grafana.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honryu.fullname" . }}-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  # Same reasoning as prometheus-deployment.yaml, applied pre-emptively
  # rather than after an incident: grafana.db is SQLite on a ReadWriteOnce
  # PVC, so overlapping old and new pods means two writers against one
  # database file. This one happened to survive its rolling update; that is
  # luck about timing, not a guarantee worth keeping.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "honryu.selectorLabels" (merge (dict "component" "grafana") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "honryu.selectorLabels" (merge (dict "component" "grafana") .) | nindent 8 }}
    spec:
      nodeSelector:
        {{- toYaml .Values.statefulNodeSelector | nindent 8 }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      # fsGroup 472 matches the Dockerfile's own "chown -R 472:0" and the
      # "grafana" user it runs as -- a freshly-provisioned PVC mounts
      # root-owned otherwise, which the non-root grafana process can't
      # write to. The uid/gid/seccomp around it were added later; fsGroup
      # was here first and is the part that was load-bearing from day one.
      securityContext:
        {{- toYaml .Values.grafana.podSecurityContext | nindent 8 }}
      containers:
        - name: grafana
          image: "{{ .Values.image.registry }}/grafana:{{ .Values.image.grafana.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.grafana.containerSecurityContext | nindent 12 }}
          env:
            # Admin credentials come from a Secret, never from the image.
            # They were ENV lines in grafana/Dockerfile until 2026-08-19,
            # which put a working Grafana admin login in a layer anyone able
            # to pull the image could read (Trivy DS-0031). Like every other
            # secret in this chart, the Secret is referenced by name and is
            # not created here.
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.grafanaAdmin }}
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.grafanaAdmin }}
                  key: admin-password
            # Anonymous read access: policy for this deployment, so it is set
            # here rather than baked into the image. Keeping the homelab's
            # existing behaviour -- dashboards are viewable without a login on
            # a LAN/tailnet-only host, and editing still needs the admin
            # credential above.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: {{ .Values.grafana.anonymous.enabled | quote }}
            {{- if .Values.grafana.anonymous.enabled }}
            - name: GF_AUTH_ANONYMOUS_ORG_NAME
              value: {{ .Values.grafana.anonymous.orgName | quote }}
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: {{ .Values.grafana.anonymous.orgRole | quote }}
            {{- end }}
            # NOT /var/lib/grafana: the Dockerfile bakes dashboards into
            # /var/lib/grafana/dashboards (grafana/provisioning/dashboards/
            # all.yml's path:), and provisioning/{{ include "honryu.fullname" . }} into
            # /etc/grafana/provisioning -- mounting a PVC at /var/lib/grafana
            # itself would shadow the baked-in dashboards directory with an
            # empty volume, and the provisioner would find nothing to load.
            # A separate data directory keeps grafana.db (sessions, starred
            # dashboards) persistent without hiding what the image ships.
            - name: GF_PATHS_DATA
              value: /var/lib/grafana-data
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana-data
            - name: plugins
              mountPath: /var/lib/grafana/plugins
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "honryu.fullname" . }}-grafana
        # Both exist only because the root filesystem is now read-only.
        # /var/lib/grafana/plugins ships in the image (verified present and
        # empty on the live pod) and Grafana expects to write it at startup;
        # it is safe to shadow with an emptyDir precisely because the one
        # vendored plugin was dropped in phase 16. Note this is *not* the
        # same path as GF_PATHS_DATA above -- mounting /var/lib/grafana
        # itself would still hide the baked-in dashboards.
        - name: plugins
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end -}}
