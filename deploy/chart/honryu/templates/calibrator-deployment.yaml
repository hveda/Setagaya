apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honryu.fullname" . }}-calibrator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
    app.kubernetes.io/component: calibrator
spec:
  replicas: {{ .Values.calibrator.replicas }}
  selector:
    matchLabels:
      {{- include "honryu.selectorLabels" (merge (dict "component" "calibrator") .) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the shared ConfigMap's contents change.
        #
        # Without this, `helm upgrade` updates the ConfigMap and stops there:
        # envFrom injects values at pod start, so a running pod keeps the env
        # it booted with and the change silently does not take effect. Found
        # exactly that way on 2026-08-19 -- the ConfigMap read
        # engine-jmeter:5.6.3-3 while the api process still had 5.6.3-2, so a
        # new run would have deployed the old engine image while every pod
        # reported healthy.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "honryu.selectorLabels" (merge (dict "component" "calibrator") .) | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.statefulNodeSelector | nindent 8 }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      containers:
        - name: calibrator
          image: "{{ .Values.image.registry }}/honryu-calibrator:{{ .Values.image.calibrator.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/honryu-calibrator"]
          envFrom:
            - configMapRef:
                name: {{ include "honryu.fullname" . }}-config
          env:
            - name: HONRYU_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mysqlCredentials }}
                  key: dsn
            - name: HONRYU_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.ingestToken }}
                  key: token
            - name: HONRYU_CALIBRATOR_TICK_INTERVAL
              value: {{ .Values.calibrator.tickInterval | quote }}
          resources:
            {{- toYaml .Values.calibrator.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /honryu-storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "honryu.fullname" . }}-object-store
