apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honryu.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "honryu.selectorLabels" (merge (dict "component" "api") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "honryu.selectorLabels" (merge (dict "component" "api") .) | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Pinned to the control-plane node: it mounts the object-store PVC,
      # which a local-path volume binds to whichever node created it. A
      # Karpenter reschedule onto a different node would strand the volume.
      nodeSelector:
        {{- toYaml .Values.statefulNodeSelector | nindent 8 }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/honryu-api:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/honryu-api"]
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "honryu.fullname" . }}-config
          env:
            - name: HONRYU_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mysqlCredentials }}
                  key: dsn
            - name: HONRYU_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.ingestToken }}
                  key: token
            - name: HONRYU_CLUSTER_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.clusterCredentialKey }}
                  key: credential-key
            - name: HONRYU_AUTH_MODE
              value: {{ .Values.api.authMode | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /honryu-storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "honryu.fullname" . }}-object-store
        # Writable /tmp, required because the root filesystem is read-only.
        # Not speculative: parseUpload calls r.ParseMultipartForm
        # (internal/adapters/httpapi/files_handlers.go:19), and Go's
        # multipart reader spills parts to os.TempDir() once they exceed the
        # in-memory budget. MaxBytesReader caps the body at the same
        # maxUploadBytes, which *should* keep every part in memory -- but
        # "should" is not what a JMX upload failing at 3am wants to rest on,
        # and an emptyDir costs nothing.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
