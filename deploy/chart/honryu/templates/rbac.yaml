# Reproduces the hand-created honryu-scheduler Role and honryu-nodes-reader
# ClusterRole verbatim from the live homelab cluster (verified 2026-08-17):
# rules are what internal/adapters/scheduler/k8s actually calls -- the
# scheduler adapter creates/lists/deletes engine ConfigMaps, StatefulSets,
# pods, pod logs, Services, and Secrets in this namespace, and lists nodes
# cluster-wide for node-pool reporting.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: honryu-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "update", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["create", "get", "update", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete", "deletecollection", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: honryu-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: honryu-scheduler
---
# Cluster-scoped: node listing has no namespace to bind a Role to, and the
# release namespace is folded into the name so two releases in different
# namespaces do not collide on one cluster-scoped object name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "honryu.fullname" . }}-nodes-reader
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "honryu.fullname" . }}-nodes-reader
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "honryu.fullname" . }}-nodes-reader
