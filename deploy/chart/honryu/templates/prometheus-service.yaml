{{- if .Values.prometheus.enabled -}}
# In-cluster only -- no Ingress route. Grafana (task 167) is the exposed
# way to look at this data; Prometheus's own UI is an operational surface,
# reachable by port-forward like /metrics itself.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "honryu.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "honryu.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  selector:
    {{- include "honryu.selectorLabels" (merge (dict "component" "prometheus") .) | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
{{- end -}}
